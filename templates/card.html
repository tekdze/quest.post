<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>quest.post card</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<div id="root"></div>

<script>
/* Tek sablon, tum sayfa tipleri.
   render.py once window.CARD_DATA'yi basar, sonra buildCard() cagirir,
   sonra fitSplit() ile gorsel/metin bolme cizgisi olculur.
   LLM bu dosyaya dokunmaz. */

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function buildCard(data) {
  const page = data.page;

  const hasImage = Boolean(page.image);

  const card = el("div", `card card--${page.type}` + (hasImage ? "" : " card--typographic"));
  card.style.setProperty("--tier", data.tier_color);

  if (hasImage) {
    const img = el("img", "card__image");
    img.src = page.image;
    card.appendChild(img);
    card.appendChild(el("div", "card__topscrim"));
  }

  card.appendChild(el("div", "card__strip"));

  if (data.credit) {
    card.appendChild(el("div", "credit", "@" + data.credit));
  }

  if (data.page_marker) {
    card.appendChild(el("div", "marker", data.page_marker));
  }

  const content = el("div", "card__content");
  content.id = "content";

  if (page.type === "cover") {
    content.appendChild(el("div", "kicker", data.tier_label));
    content.appendChild(el("div", "category", data.category));
    content.appendChild(el("h1", "title", page.title));
    const foot = el("div", "footline");
    foot.appendChild(el("span", null, data.game));
    content.appendChild(foot);
  }

  if (page.type === "text") {
    content.appendChild(el("h2", "title", page.title));
    if (page.paragraph) content.appendChild(el("p", "body", page.paragraph));
    if (page.bullets && page.bullets.length) {
      const list = el("ul", "bullets");
      page.bullets.forEach(b => list.appendChild(el("li", null, b)));
      content.appendChild(list);
    }
  }

  if (page.type === "numbers") {
    content.appendChild(el("h2", "title", page.title));
    const wrap = el("div", "metrics");
    page.metrics.forEach(m => {
      const row = el("div", "metric");
      row.appendChild(el("div", "metric__value", m.value));
      row.appendChild(el("div", "metric__label", m.label));
      wrap.appendChild(row);
    });
    content.appendChild(wrap);
  }

  if (page.type === "outro") {
    content.appendChild(el("h2", "title", page.question));

    // Tek cagri kutusu. Iki kutu vardi, zayif metne esit agirlik veriyordu.
    const ctas = el("div", "ctas");
    ctas.appendChild(el("div", "cta", page.ctas[0]));
    content.appendChild(ctas);

    const colophon = el("div", "colophon");
    const meta = el("div", "colophon__meta");
    meta.appendChild(el("div", "colophon__handle", data.handle));
    meta.appendChild(el("div", "colophon__tagline", data.tagline));
    colophon.appendChild(meta);
    // Tier adi kunyede yaziyla da gecsin: renk tek basina okunmuyor.
    const tier = el("div", "colophon__tier");
    tier.appendChild(el("span", "colophon__tierlabel", "haberin kademesi"));
    tier.appendChild(el("span", "colophon__tiername", data.tier_label));
    colophon.appendChild(tier);

    const foot = el("div", "outro__foot");
    foot.appendChild(colophon);
    foot.appendChild(el("div", "follow", data.follow));
    content.appendChild(foot);
  }

  card.appendChild(content);

  const root = document.getElementById("root");
  root.textContent = "";
  root.appendChild(card);
  return card;
}

/* Gorsel ile metin arasindaki BOLME CIZGISI metnin olculen boyuna gore
   hesaplanir. Sabit oran denendi ve olmadi: kapakta guzel duran %80,
   metin sayfasinda basligi gorselin ustune tasiriyor ve son maddeyi
   kesiyordu (olcum 2026-08-31, fable postu).

   Cizgi metnin BITTIGI yere konuyor, yani metin her zaman sigar.
   Tavan var: cok kisa metinde kart bos gorunmesin.
   Taban ESTETIK bir tercih degil, SERT bir sinir: metni kesmek pahasina
   gorseli buyuk tutmak yanlis (olcum 2026-08-31: 697px metin %52 tabanda
   kartin disina tasti). Kart gorsel agirligini metnin KISA olmasiyla
   korur, kirparak degil - uslup kurallari zaten paragrafi sinirliyor. */
const GORSEL_TAVAN = 82;
// Bu kadarindan sonra gorsel serit gibi kaliyor; metin daha da uzunsa
// render raporunda "tasma" uyarisi cikar.
const GORSEL_SERT_TABAN = 30;

function fitSplit() {
  const card = document.querySelector(".card");
  const content = document.getElementById("content");
  if (!card || !content || card.classList.contains("card--typographic")) return null;

  const H = 1350;
  // Once serbest birak, dogal yuksekligini olc, sonra cizgiyi koy.
  content.style.top = "auto";
  content.style.height = "auto";
  const metin = content.getBoundingClientRect().height;
  content.style.top = "";
  content.style.height = "";

  // 6px pay: yuvarlama yuzunden metin son piksellerde tasiyordu.
  const ham = 100 - ((metin + 6) / H) * 100;
  const oran = Math.max(GORSEL_SERT_TABAN, Math.min(GORSEL_TAVAN, ham));
  card.style.setProperty("--gorsel-h", oran.toFixed(2) + "%");

  return {
    content_height: Math.round(metin),
    gorsel_pct: +oran.toFixed(1),
    tasma: metin > H * (1 - oran / 100) + 1,
  };
}

window.renderCard = function (data) {
  buildCard(data);
  return fitSplit();
};

/* Gorsel ve fontlar yuklendikten sonra render.py yeniden olcturuyor:
   font yuklenmesi metin blogunun yuksekligini degistirebiliyor. */
window.fitSplit = fitSplit;
</script>
</body>
</html>
