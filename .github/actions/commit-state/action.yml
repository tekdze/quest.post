# Bot kendi ürettiği durum dosyalarını repoya yazar. Üç workflow da aynı işi
# yaptığı için ortak adım: kopyalanan üç blok birbirinden sapardı.
#
# Actions'ın "Read and write permissions" ayarı açık olmalı; kapalıysa push
# sessizce başarısız olur ve bot hiçbir şeyi hatırlamaz.
name: durumu kaydet
description: state/ ve out/ altındaki değişiklikleri commit edip push eder

inputs:
  message:
    description: commit mesajı
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # Shell'e dogrudan gomulmez: mesaj env uzerinden gecer.
        COMMIT_MESAJI: ${{ inputs.message }}
      run: |
        set -euo pipefail

        git config user.name "quest.post bot"
        git config user.email "bot@users.noreply.github.com"

        # out/ da eklenir: kartlar Instagram'a herkese açık URL ile
        # verilecek (Graph API dosya yüklemiyor).
        git add state out 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "degisiklik yok, commit atlaniyor"
          exit 0
        fi

        git commit -m "$COMMIT_MESAJI"

        # Aynı anda başka biri push etmiş olabilir: başka bir workflow ya da
        # kullanıcının kendi commit'leri. Rebase edip yeniden dene.
        #
        # ⚠️ Çakışma olursa state dosyalarında BİZİM sürüm kazanır. Bunlar
        # üretilmiş durum dosyaları; satır satır birleştirmek anlamsız,
        # doğru olan "en son yazan geçerli". Rebase yarıda kalınca bot
        # sessizce hafızasını kaybediyordu.
        #
        # posted.json istisna: yayınlanan/iptal edilen haberlerin arşivi ve
        # ekleme yapılan bir dosya. İki taraf da kayıt eklemiş olabilir,
        # birinin sürümünü almak haberin tekrar aday olmasına yol açar.
        for deneme in 1 2 3; do
          if git push; then
            echo "push tamam (deneme $deneme)"
            exit 0
          fi
          echo "push reddedildi, rebase deneniyor ($deneme)"
          git fetch origin "${GITHUB_REF_NAME}"

          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "cakisma var, state dosyalarinda bizim surum aliniyor"

            # posted.json'u once birlestir: iki taraftaki hash'ler toplanir.
            if git ls-files -u | grep -q "state/posted.json"; then
              python "${GITHUB_ACTION_PATH}/merge_posted.py"
              git add state/posted.json
            fi

            # Kalan cakismalarda bizim surum (rebase'de --theirs = uygulanan
            # commit, yani bot'un yazdigi).
            git checkout --theirs -- state out 2>/dev/null || true
            git add -A
            GIT_EDITOR=true git rebase --continue || {
              echo "rebase cozulemedi, iptal ediliyor"
              git rebase --abort || true
              exit 1
            }
          fi
          sleep 3
        done

        echo "push uc denemede basarisiz oldu"
        exit 1
